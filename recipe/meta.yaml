{% set name = "alignn" %}
{% set version = "2026.10.11" %}
{% set python_min = python_min | default("3.10") %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/atomgptlab/alignn/archive/refs/tags/v{{ version }}.tar.gz
  sha256: c3265328230a1a3f995feb5be34df581106670f2564a60fc08cbea2201c4b065

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.19.5,<2.0.0
    - scipy >=1.6.1
    - jarvis-tools >=2021.07.19
    - pytorch >=2.0.0
    - mpmath >=1.3.0
    - spglib >=2.0.2
    - scikit-learn >=0.22.2
    - matplotlib-base >=3.4.1
    - tqdm >=4.60.0
    - pandas >=1.2.3
    - pydantic >=1.8.1
    - pydantic-settings
    - ase
    - python-lmdb
    - flake8 >=3.9.1
    - pycodestyle >=2.7.0
    - pydocstyle >=6.0.0

test:
  imports:
    - alignn
  commands:
    - pip check
    - train_alignn.py -h
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/atomgptlab/alignn
  summary: Atomistic Line Graph Neural Network & force-field
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - knc6
